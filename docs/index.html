<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANI MPV - Anime & Manga Web Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- HLS.js for Web Video Streaming (m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="topbar">
        <div class="logo">
            <span class="logo-pink">ANI</span><span class="logo-white">MPV</span>
            <span class="badge">Web</span>
        </div>
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="anime"><i class="fa-solid fa-tv"></i> Anime</button>
            <button class="tab-btn" data-tab="mylist"><i class="fa-solid fa-bookmark"></i> My List</button>
        </nav>
        <a href="https://github.com/Riju2007123/ani-mpv/releases/latest" target="_blank" class="apk-download-btn">
            <i class="fa-solid fa-android"></i> Get APK
        </a>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Search Bar (shared) -->
        <div class="search-bar-container">
            <input type="text" id="searchInput" placeholder="Search anime (Bleach, Naruto, One Piece...)">
            <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Anime Tab Section -->
        <section id="tab-anime" class="tab-content active">
            <div id="animeContainer">
                <div id="animeSpotlight" class="spotlight"></div>
                <div class="section-row">
                    <h2 class="section-title"><i class="fa-solid fa-fire"></i> Trending Anime</h2>
                </div>
                <div id="animeGrid" class="manga-grid"></div>

                <div class="section-row">
                    <h2 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Continue Watching</h2>
                </div>
                <div id="continueGrid" class="manga-grid"></div>
            </div>
        </section>

        <!-- My List Tab Section -->
        <section id="tab-mylist" class="tab-content">
            <div id="mylistContainer">
                <div class="section-row">
                    <h2 class="section-title"><i class="fa-solid fa-bookmark"></i> Watchlist</h2>
                </div>
                <div id="watchlistGrid" class="manga-grid"></div>

                <div class="section-row">
                    <h2 class="section-title"><i class="fa-solid fa-history"></i> History</h2>
                </div>
                <div id="historyGrid" class="manga-grid"></div>

                <div class="section-row">
                    <h2 class="section-title"><i class="fa-solid fa-download"></i> Downloads</h2>
                    <p class="empty-hint">Downloads managed in the Android app. Tap a watchlist item to stream here.</p>
                </div>
                <div id="downloadsGrid" class="manga-grid"></div>
            </div>
        </section>
    </main>

    <!-- Video Player Modal -->
    <div id="playerModal" class="modal">
        <div class="modal-content player-modal">
            <div class="player-header">
                <button id="closePlayer" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
                <h3 id="playerTitle">Anime Player</h3>
                <div class="player-actions">
                    <button id="btnBookmark" class="icon-btn" title="Bookmark"><i class="fa-solid fa-bookmark"></i></button>
                    <button id="btnDownload" class="icon-btn" title="Download"><i class="fa-solid fa-download"></i></button>
                </div>
            </div>
            <div class="video-container">
                <video id="videoPlayer" controls autoplay playsinline webkit-playsinline></video>
            </div>
            <div class="player-info" id="playerInfo"></div>
        </div>
    </main>

    <!-- Episode Picker Modal (for details) -->
    <div id="episodeModal" class="modal">
        <div class="modal-content episode-modal">
            <div class="player-header">
                <button id="closeEpisode" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
                <h3 id="episodeTitle">Select Episode</h3>
            </div>
            <div id="episodeGrid" class="manga-grid"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
